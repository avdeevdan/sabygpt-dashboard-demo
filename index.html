<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генерация дашборда</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="vendor/ui-kit/tokens.css">
<link rel="stylesheet" href="vendor/ui-kit/components/demo-frame/demo-frame.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage" class="stage">
  <div id="app">
    <!-- Шапка 44px -->
    <header class="topbar">
      <div class="topbar__title"></div>
      <div class="tumbler"><span class="tumbler__item is-active"><i class="ic ic-14">&#xE730;</i></span><span class="tumbler__item"><i class="ic ic-14">&#xE637;</i></span><span class="tumbler__item"><i class="ic ic-14">&#xEAB4;</i></span></div>
      <div class="topbar__cmds">
        <button class="btn-gpt" id="gptBtn" title="SabyGPT" aria-label="SabyGPT"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.5654 8.54545L16.9695 9.91919L7.87857 21.9192C8.04018 21.6498 8.48463 20.8013 9.2119 19.3737C9.23884 19.2929 9.27924 19.2121 9.33311 19.1313L9.41392 18.9697C9.41392 18.9428 9.42739 18.9158 9.45432 18.8889L9.53513 18.6869C9.53513 18.6599 9.5486 18.633 9.57554 18.6061L9.65634 18.4444C9.95264 17.8788 10.2355 17.2997 10.5048 16.7071L10.6664 16.4242C10.9627 15.8316 11.259 15.2256 11.5553 14.6061L11.6765 14.4444C11.6765 14.4175 11.69 14.3906 11.7169 14.3636L11.7978 14.1616C11.8247 14.1347 11.8382 14.1077 11.8382 14.0808L11.9594 13.8788C11.9863 13.798 12.0267 13.7037 12.0806 13.596L4.72705 2L14.626 8.38384C14.9762 7.65657 15.3802 6.84848 15.8382 5.9596L19.2725 4.90909L16.5654 8.54545ZM7.87857 21.9596C7.87857 21.9596 7.8651 21.9731 7.83816 22L7.87857 21.9192V21.9596Z" fill="#5A49AB"/></svg></button>
        <span class="sep"></span>
        <button class="btn-icon is-disabled" id="undoBtn" aria-label="Отменить"><i class="ic ic-20">&#xE6CF;</i></button>
        <button class="btn-icon is-disabled" id="redoBtn" aria-label="Повторить"><i class="ic ic-20">&#xE6CA;</i></button>
        <button class="btn-icon" aria-label="Сброс"><i class="ic ic-20">&#xE629;</i></button>
        <span class="sep"></span>
        <span class="zoom"><button class="zoom__btn" aria-label="Уменьшить"><i class="ic ic-24">&#xE6EA;</i></button><span>75%</span><button class="zoom__btn" aria-label="Увеличить"><i class="ic ic-24">&#xE6E9;</i></button></span>
        <button class="btn-done" aria-label="Сохранить"><i class="ic ic-24">&#xE75E;</i></button>
        <button class="btn-close" aria-label="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
      </div>
    </header>

    <div class="body">
      <!-- Экран с дашбордом -->
      <main class="screens">
        <section class="dashboard" id="dashboard">
          <div class="dash-grid" id="currentGrid">
            <!-- Положи экспорт из Figma (узел 19:10503) в assets/dashboard.png -->
            <div class="dash-existing">
              <div class="w-col">
                <div class="wcell wcell--1" style="height:251.5px"></div>
                <div class="wcell wcell--2" style="height:128.5px"></div>
              </div>
              <div class="w-col">
                <div class="wcell wcell--3" style="height:190px"></div>
                <div class="wcell wcell--4" style="height:190px"></div>
              </div>
            </div>
            <div class="dash-inserted" id="insertedGrid"></div>
          </div>
          <div class="dash-ops" aria-hidden="true">
            <div class="dash-ops__grp"><span class="dash-ops__pill"><i class="g g--20">&#xE75D;</i></span></div>
            <div class="dash-ops__grp">
              <span class="dash-ops__btn"><i class="g">&#xE636;</i></span>
              <span class="dash-ops__btn"><i class="g">&#xE65D;</i></span>
            </div>
          </div>
          <aside class="dash-notify">
            <div class="wcell ncell--1" style="height:209px"></div>
            <div class="wcell ncell--2" style="height:227px"></div>
            <div class="wcell ncell--3" style="height:482px"></div>
          </aside>
          <!-- Окно SabyGPT: подложка (@pale-color) на весь дашборд, окно — по его центру -->
          <div class="gpt-scrim" id="gptScrim" hidden>
            <div class="gpt" id="gptWindow" role="dialog" aria-label="SabyGPT">
              <div class="gpt__header">
                <div class="gpt__headL"><button class="gpt__model" id="modelBtn"><i class="ic ic-16" id="modelIcon">&#xE9E2;</i><span id="modelName">SabyGPT</span></button>
                  <div class="gpt__variants" id="variants" hidden>
                    <div class="gpt__arrows">
                      <button class="gpt__arrow" id="varPrev" title="Предыдущий вариант"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5L5 8l4.5 4.5"/></svg></button>
                      <button class="gpt__arrow gpt__arrow--next" id="varNext" title="Следующий вариант"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5L5 8l4.5 4.5"/></svg></button>
                    </div>
                    <span class="gpt__count" id="varCount">1 / 1</span>
                  </div>
                </div>
                <div class="gpt__headR">
                  <button class="gpt__launch" id="launchBtn" hidden title="Сгенерировать"><i class="ic ic-16">&#xEB1A;</i></button>
                  <button class="gpt__tool" id="refreshBtn" hidden title="Сгенерировать заново"><i class="ic ic-24">&#xE62C;</i></button>
                  <button class="gpt__tool gpt__tool--ok" id="doneBtn" hidden title="Применить результат"><i class="ic ic-24">&#xE75E;</i></button>
                  <button class="gpt__icon" id="gptClose" title="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
                </div>
              </div>
              <div class="popup" id="modelPopup" hidden>
                <button class="popup__x" id="modelPopupX" title="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
              </div>
              <div class="gpt__body" id="gptBody">
                <div id="presets"></div>
              </div>
              <!-- «Провал» по клику на последний пункт списка: стрелка назад + поле промта -->
              <div class="gpt__sub" id="promptZone" hidden>
                <div class="gpt__row">
                  <button class="gpt__back" id="backBtn" title="Назад"><i class="ic ic-20">&#xE9A9;</i></button>
                  <input class="gpt__rowtext" id="rowInput" type="text" maxlength="120" placeholder="Собери свой дашборд" autocomplete="off">
                </div>
                <div class="gpt__box"><textarea id="promptInput" rows="1" placeholder="Например, нужен дашборд с отображением остатков товаров"></textarea></div>
                <div class="gpt__hint" id="hint" hidden>Например: нужен дашборд для работы с сотрудниками и задачами</div>
                <div class="gpt__chips" id="chips" hidden></div>
                <div class="gen" id="genZone" hidden>
                  <div class="gen__t">Генерируем ответ...</div>
                  <div class="gen__img"><img src="assets/gen.gif" alt=""></div>
                  <button class="gen__stop" id="stopBtn">Прервать</button>
                </div>
                <div class="result-prev" id="resultPrev" hidden><div class="result-prev__in"><img id="resultImg" alt="Предпросмотр результата"></div></div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Правый сайдбар 54px -->
      <aside class="env-side">
      <div class="env-side__nav">
        <span class="env-side__i env-side__i--primary"><i class="g g--24">&#xEADD;</i></span>
        <span class="env-side__i"><i class="g g--20">&#xEBBC;</i></span>
        <span class="env-side__i"><i class="g g--20">&#xEBF9;</i></span>
        <span class="env-side__i"><i class="g g--24">&#xE94C;</i></span>
        <span class="env-side__i"><i class="g g--24">&#xEAA7;</i></span>
        <span class="env-side__i"><i class="g g--24">&#xEAA9;</i></span>
      </div>
      <span class="env-help">?</span>
    </aside>
    </div>

  </div>
</div>
<script src="vendor/ui-kit/components/demo-frame/demo-frame.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
